[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aidlc-common"
version = "0.1.0"
description = "Shared helpers for all stages: config, contracts, IO, MLflow traceability, gates, events"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]
