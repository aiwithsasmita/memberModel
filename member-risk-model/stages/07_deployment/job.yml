# Standalone job for 07_deployment (runs this stage alone; the full pipeline is pipelines/pipeline_job.yml)
resources:
  jobs:
    mrs_07_deployment:
      name: mrs-07_deployment-${bundle.target}
      run_as: {service_principal_name: "${var.pipeline_sp}"}
      schedule: {quartz_cron_expression: "0 0 7 1 1,3,6,9 ?", timezone_id: "Asia/Kolkata"}   # cutoffs, see config/scoring.yaml
      tasks:
        - task_key: run
          spark_python_task: {python_file: ./src/run.py}
          environment_key: default
      environments:
        - environment_key: default
          spec: {client: "2", dependencies: ["../../common"]}
