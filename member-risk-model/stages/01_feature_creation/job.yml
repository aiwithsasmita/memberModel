# Standalone job for 01_feature_creation (runs this stage alone; the full pipeline is pipelines/pipeline_job.yml)
resources:
  jobs:
    mrs_01_feature_creation:
      name: mrs-01_feature_creation-${bundle.target}
      run_as: {service_principal_name: "${var.pipeline_sp}"}
      tasks:
        - task_key: run
          spark_python_task: {python_file: ./src/run.py}
          environment_key: default
      environments:
        - environment_key: default
          spec: {client: "2", dependencies: ["../../common"]}
